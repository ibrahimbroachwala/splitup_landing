<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/style.css">
<style>
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#ffdb1f;color:#1a1a1a;display:flex;align-items:center;position:relative}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(26,26,26,.10) 2px,transparent 2.3px);background-size:30px 30px;-webkit-mask-image:none;mask-image:none}
  .in{position:relative;z-index:2;padding:0 72px;max-width:780px}
  h1{font-size:88px;font-weight:800;line-height:1.02;letter-spacing:-.035em}
  h1 mark{display:inline-block;padding:0 .16em .02em;border-radius:14px;background:#1a1a1a;color:#ffdb1f;transform:rotate(-2deg)}
  p{margin-top:22px;font-size:30px;font-weight:500;color:rgba(26,26,26,.78)}
  .row{display:flex;gap:14px;margin-top:34px}
  .s{display:inline-flex;align-items:center;gap:9px;padding:13px 24px;border:3px solid #33302b;border-radius:32px;background:#fff9f0;box-shadow:5px 5px 0 rgba(26,26,26,.30);font-size:23px;font-weight:700}
  .s:nth-child(1){transform:rotate(-3deg)}.s:nth-child(2){transform:rotate(2deg)}.s:nth-child(3){transform:rotate(-2deg)}
  .mark{position:absolute;right:66px;top:50%;transform:translateY(-50%) rotate(-6deg);width:300px;height:300px;border:4px solid #33302b;border-radius:66px;box-shadow:9px 9px 0 rgba(26,26,26,.22);overflow:hidden;background:#fff}
  .mark img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<div class="dots"></div>
<div class="in">
  <h1>Split. Remind.<br><mark>Settle.</mark></h1>
  <p>Group bills and expenses,<br>minus the awkward math.</p>
  <div class="row"><span class="s">🎙️ Voice input</span><span class="s">📵 Offline</span><span class="s">💸 No subs</span></div>
</div>
<div class="mark"><img src="/assets/app-icon.png" alt=""></div>
</body></html>
